# Deployment for PlaylistManager service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playlistmanager
  namespace: muzika
  labels:
    app: playlistmanager
    app.kubernetes.io/name: playlistmanager
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: muzika-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playlistmanager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: playlistmanager
        app.kubernetes.io/name: playlistmanager
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: muzika-platform
    spec:
      serviceAccountName: playlistmanager-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: playlistmanager
          image: ${ACR_NAME}.azurecr.io/muzika/playlistmanager:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
          envFrom:
            - configMapRef:
                name: playlistmanager-config
            - secretRef:
                name: playlistmanager-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              memory: "384Mi"
              cpu: "50m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 8092
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: playlistmanager-azure-keyvault

---
# ServiceAccount for PlaylistManager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playlistmanager-sa
  namespace: muzika
  labels:
    app: playlistmanager
    app.kubernetes.io/name: playlistmanager
    app.kubernetes.io/part-of: muzika-platform
